<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Tracker</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f4f6f8;
    }
    h1 {
      text-align: center;
    }
    .routine, .exercise {
      background: white;
      margin: 1rem 0;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    input, button {
      padding: 0.5rem;
      margin: 0.25rem 0;
      width: 100%;
    }
    button {
      background: #333;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background: #555;
    }
  </style>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyC3caJRgmk-Ks7Kyb-vaBC3TrZ20S40aCc",
  authDomain: "sololevelling-be626.firebaseapp.com",
  projectId: "sololevelling-be626",
  storageBucket: "sololevelling-be626.firebasestorage.app",
  messagingSenderId: "190412484712",
  appId: "1:190412484712:web:b6b625c9e7069b977d8bdd",
  measurementId: "G-MB6L0N8YSQ"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.firebaseDB = db;
  </script>
</head>
<body>
  <h1>Workout Tracker</h1>
  <div>
    <input type="text" id="routineName" placeholder="Routine name (e.g., Chest Day)" />
    <button onclick="addRoutine()">Add Routine</button>
  </div>
  <div id="routineList"></div>

  <script>
    const routineList = document.getElementById("routineList");
    let routines = [];

    async function saveRoutine() {
      const db = window.firebaseDB;
      await setDoc(doc(db, "tracker", "user1"), { routines });
    }

    async function loadRoutine() {
      const db = window.firebaseDB;
      const docSnap = await getDoc(doc(db, "tracker", "user1"));
      if (docSnap.exists()) {
        routines = docSnap.data().routines;
        renderRoutines();
      }
    }

    function addRoutine() {
      const name = document.getElementById("routineName").value;
      if (name) {
        routines.push({ name, exercises: [] });
        document.getElementById("routineName").value = "";
        renderRoutines();
        saveRoutine();
      }
    }

    function addExercise(routineIndex) {
      const exerciseName = prompt("Exercise name?");
      const weight = prompt("Weight?");
      const reps = prompt("Reps?");
      const sets = prompt("Sets?");
      const note = prompt("Any notes?");

      routines[routineIndex].exercises.push({ exerciseName, weight, reps, sets, note });
      renderRoutines();
      saveRoutine();
    }

    function renderRoutines() {
      routineList.innerHTML = routines.map((routine, index) => `
        <div class="routine">
          <h2>${routine.name}</h2>
          <button onclick="addExercise(${index})">Add Exercise</button>
          ${routine.exercises.map(ex => `
            <div class="exercise">
              <strong>${ex.exerciseName}</strong><br/>
              ${ex.weight} kg x ${ex.reps} reps x ${ex.sets} sets<br/>
              <em>Note: ${ex.note || 'None'}</em>
            </div>`).join('')}
        </div>`).join('');
    }

    loadRoutine();
  </script>
</body>
</html>
