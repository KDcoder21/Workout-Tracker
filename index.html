<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Tracker</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f4f6f8;
    }
    h1 {
      text-align: center;
      font-size: 2rem;
    }
    .routine, .exercise {
      background: white;
      margin: 1rem 0;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .routine h2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    input, button {
      padding: 0.5rem;
      margin: 0.25rem 0;
      width: 100%;
      font-size: 1rem;
    }
    button {
      background: #333;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background: #555;
    }
    .btn-top:hover{
        cursor : crosshair ;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 1.5rem;
      }
      input, button {
        font-size: 0.9rem;
      }
    }
    .chart-container {
      margin-top: 1rem;
    }
  </style>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3caJRgmk-Ks7Kyb-vaBC3TrZ20S40aCc",
      authDomain: "sololevelling-be626.firebaseapp.com",
      projectId: "sololevelling-be626",
      storageBucket: "sololevelling-be626.firebasestorage.app",
      messagingSenderId: "190412484712",
      appId: "1:190412484712:web:b6b625c9e7069b977d8bdd",
      measurementId: "G-MB6L0N8YSQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.firebaseDB = db;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Workout Tracker</h1>
  <div>
    <input type="text" id="routineName" placeholder="Routine name (e.g., Chest Day)" />
    <button onclick="addRoutine()" class="btn-top">Add Routine</button>
  </div>
  <div id="routineList"></div>

  <script>
    const routineList = document.getElementById("routineList");
    let routines = [];

    async function saveRoutine() {
      const db = window.firebaseDB;
      await setDoc(doc(db, "tracker", "user1"), { routines });
    }

    async function loadRoutine() {
      const db = window.firebaseDB;
      const docSnap = await getDoc(doc(db, "tracker", "user1"));
      if (docSnap.exists()) {
        routines = docSnap.data().routines || [];
        renderRoutines();
      }
    }

    function addRoutine() {
      const name = document.getElementById("routineName").value;
      if (name) {
        routines.push({ name, exercises: [] });
        document.getElementById("routineName").value = "";
        renderRoutines();
        saveRoutine();
      }
    }

    function deleteRoutine(index) {
      if (confirm("Are you sure you want to delete this routine?")) {
        routines.splice(index, 1);
        renderRoutines();
        saveRoutine();
      }
    }

    function addExercise(routineIndex) {
      const exerciseName = prompt("Exercise name?");
      const weight = prompt("Weight?");
      const reps = prompt("Reps?");
      const sets = prompt("Sets?");
      const note = prompt("Any notes?");

      if (!exerciseName) return;
      const week = new Date().toISOString().split('T')[0];
      routines[routineIndex].exercises.push({ exerciseName, weight, reps, sets, note, week });
      renderRoutines();
      saveRoutine();
    }

    function editExercise(routineIndex, exerciseIndex) {
      const ex = routines[routineIndex].exercises[exerciseIndex];
      const exerciseName = prompt("Exercise name?", ex.exerciseName);
      const weight = prompt("Weight?", ex.weight);
      const reps = prompt("Reps?", ex.reps);
      const sets = prompt("Sets?", ex.sets);
      const note = prompt("Any notes?", ex.note);

      routines[routineIndex].exercises[exerciseIndex] = { exerciseName, weight, reps, sets, note, week: ex.week };
      renderRoutines();
      saveRoutine();
    }

    function renderProgress(exercises) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const grouped = {};
      exercises.forEach(e => {
        const key = e.week;
        const val = parseFloat(e.weight) * parseInt(e.reps) * parseInt(e.sets);
        grouped[key] = (grouped[key] || 0) + val;
      });
      const labels = Object.keys(grouped);
      const data = Object.values(grouped);

      new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Volume per Week',
            data,
            fill: false,
            borderColor: 'blue',
            tension: 0.1
          }]
        }
      });
      return canvas;
    }

    function renderRoutines() {
      routineList.innerHTML = routines.map((routine, index) => {
        const chart = renderProgress(routine.exercises);
        const exercisesHTML = routine.exercises.map((ex, i) => `
          <div class="exercise" onclick="editExercise(${index}, ${i})">
            <strong>${ex.exerciseName}</strong><br/>
            ${ex.weight} kg x ${ex.reps} reps x ${ex.sets} sets<br/>
            <em>Note: ${ex.note || 'None'}</em>
          </div>
        `).join('');

        return `
          <div class="routine">
            <h2>
              ${routine.name}
              <button onclick="deleteRoutine(${index})">Delete</button>
            </h2>
            <button onclick="addExercise(${index})">Add Exercise</button>
            ${exercisesHTML}
            <div class="chart-container"></div>
          </div>
        `;
      }).join('');

      // After setting innerHTML, inject charts manually
      document.querySelectorAll(".chart-container").forEach((container, i) => {
        const chart = renderProgress(routines[i].exercises);
        container.appendChild(chart);
      });
    }

    loadRoutine();
  </script>
</body>
</html>
